■ メモ帳
・左下の「＋追加」で新しいメモを作ります。入力すると自動で保存されるので、保存ボタンはありません。終わったら「閉じる」を押します。
・一覧には、タイトルと最初の5行だけが出ます。タップすると全文が開き、ブックマーク・編集・履歴・複製・削除のボタンが出ます。

・左上の「📁フォルダ」で、フォルダの切り替え・作成・削除ができます。

・検索欄は、タイトル・本文・タグが対象です。
・並び替えは、更新順・作成順・タイトル順・文字数順から選べます。

■ 注意メッセージ
保存の際に、NGワード・リンクの重複・本文1000文字超を見つけると、赤い注意を出します。保存は止まりません。

■ ダイス(右上の🎲)
・左上の「📁」でフォルダを最大10個、タグを最大10個まで選びます。何も選ばなければ、全メモが対象です。

 e.style.fontFamily=(b.font==="custom"&&b.fontData)?'"BubbleCustom",sans-serif':(FONTS[b.font||""]||"");

 else{e.style.background="";e.style.border="";e.style.borderRadius="";e.style.padding=""}}
